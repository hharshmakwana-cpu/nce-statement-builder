<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Prepare the Balance Sheet, Statement of Profit and Loss and notes for non-corporate entities in the ICAI format. Export to Excel and PDF.">
<meta name="theme-color" content="#1d5b47">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="NCE Statements">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); color-scheme: light; }
body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<title>NCE Statement Builder</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
/* Layout: ledger workbook. Fixed left index of notes, working sheet on the right; statements set like a printed schedule. */
:root {
  --paper: #fafbf9;
  --sheet: #ffffff;
  --ink: #1b2420;
  --muted: #5d6a64;
  --rule: #dfe5e1;
  --rule-strong: #b9c4be;
  --accent: #1d5b47;
  --accent-soft: #e5efea;
  --entry: #1f4fbf;          /* blue ink = typed figure, the spreadsheet convention */
  --entry-bg: #f3f6fd;
  --good: #1f7a4a;
  --warn: #9a6100;
  --bad: #b3261e;
  --bad-soft: #fbeceb;
  --warn-soft: #fbf3e2;
  --good-soft: #e6f3eb;
  --font-ui: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-doc: "Source Serif 4", Georgia, "Times New Roman", serif;
  --font-sheet: "Trebuchet MS", "Lucida Grande", "Segoe UI", sans-serif;
  --paper-bg: #ffffff;
  --paper-ink: #000000;
  --paper-line: #000000;
  --paper-muted: #444444;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #111614; --sheet: #171d1a; --ink: #e3e9e5; --muted: #95a39c;
    --rule: #28312d; --rule-strong: #3c4842; --accent: #7cc4a6; --accent-soft: #1d2c26;
    --entry: #8fb1ff; --entry-bg: #1a2130; --good: #6fcf97; --warn: #e2b04a; --bad: #ff8a80;
    --bad-soft: #3a1f1d; --warn-soft: #33290f; --good-soft: #17301f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #111614; --sheet: #171d1a; --ink: #e3e9e5; --muted: #95a39c;
  --rule: #28312d; --rule-strong: #3c4842; --accent: #7cc4a6; --accent-soft: #1d2c26;
  --entry: #8fb1ff; --entry-bg: #1a2130; --good: #6fcf97; --warn: #e2b04a; --bad: #ff8a80;
  --bad-soft: #3a1f1d; --warn-soft: #33290f; --good-soft: #17301f; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-ui); font-size: 14px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--sheet); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--sheet); border-bottom: 1px solid var(--rule);
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center;
}
.brand { font-family: var(--font-doc); font-weight: 600; font-size: 17px; letter-spacing: .01em; margin-right: 4px; }
.brand small { font-family: var(--font-ui); font-weight: 400; color: var(--muted); font-size: 12px; margin-left: 6px; }
.top .grow { flex: 1 1 auto; }
.entity-pick { display: flex; gap: 6px; align-items: center; min-width: 0; }
.entity-pick select { max-width: 240px; }
select, .btn, input.txt, textarea {
  border: 1px solid var(--rule-strong); background: var(--sheet); border-radius: 6px; padding: 6px 10px;
}
.btn { background: var(--sheet); white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--sheet); border-color: var(--accent); }
.btn.danger { color: var(--bad); border-color: var(--bad); }
.btn.small { padding: 3px 8px; font-size: 12.5px; }
.status { color: var(--muted); font-size: 12.5px; }
.pill { display: inline-flex; gap: 6px; align-items: center; padding: 4px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 500; border: 0; }
.pill.ok { background: var(--good-soft); color: var(--good); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }

.app { display: grid; grid-template-columns: 250px minmax(0, 1fr); min-height: calc(100vh - 60px); }
nav.side {
  border-right: 1px solid var(--rule); background: var(--sheet); padding: 14px 10px 40px;
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + 57px); align-self: start;
  height: calc(100vh - 57px); overflow-y: auto;
}
nav.side h4 { margin: 14px 8px 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
nav.side a { display: grid; grid-template-columns: 34px 1fr; gap: 4px; padding: 5px 8px; border-radius: 6px; color: var(--ink); text-decoration: none; font-size: 13.5px; }
nav.side a .no { color: var(--muted); font-variant-numeric: tabular-nums; }
nav.side a:hover { background: var(--accent-soft); }
nav.side a.on { background: var(--accent); color: var(--sheet); }
nav.side a.on .no { color: inherit; opacity: .8; }
.mobile-nav { display: none; }

main {
  padding-block: 20px 80px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  min-width: 0;
}
.page { max-width: 1100px; margin: 0 auto; display: grid; gap: 18px; }
.page-head { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; justify-content: space-between; }
.page-head h1 { font-family: var(--font-doc); font-weight: 600; font-size: 24px; margin: 0; text-wrap: balance; }
.page-head h1 .nno { color: var(--accent); margin-right: 8px; }
.lead { color: var(--muted); margin: 0; max-width: 70ch; }
.banner { background: var(--warn-soft); color: var(--ink); border-radius: 8px; padding: 10px 14px; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.banner b { color: var(--warn); }

.sheet { background: var(--sheet); border: 1px solid var(--rule); border-radius: 4px; }
.scroll { overflow-x: auto; }
table.grid { border-collapse: collapse; width: 100%; font-family: var(--font-sheet); font-size: 13.5px; color: var(--paper-ink); background: var(--paper-bg); font-variant-numeric: tabular-nums; border: 1px solid var(--paper-line); }
table.grid th, table.grid td { padding: 3px 7px; text-align: left; vertical-align: middle; }
table.grid thead th { font-weight: 700; color: var(--paper-ink); border: 1px solid var(--paper-line); white-space: nowrap; text-align: center; }
table.grid thead th:nth-child(2) { text-align: left; }
table.grid thead tr.grp th:empty { border-top-color: transparent; border-left-color: transparent; }
table.grid th.num, table.grid td.num { text-align: right; width: 150px; min-width: 120px; border-left: 1px solid var(--paper-line); border-right: 1px solid var(--paper-line); }
table.grid td.tag { width: 40px; color: var(--paper-ink); white-space: nowrap; text-align: center; border-right: 1px solid var(--paper-line); }
table.grid tr.sec td { font-weight: 700; text-decoration: underline; padding-top: 10px; }
table.grid tr.sec td.num, table.grid tr.hd td.num { text-decoration: none; }
table.grid tr.hd td { font-weight: 700; }
table.grid tr.sub td { font-weight: 700; }
table.grid tr.sub td.num { border-top: 1px solid var(--paper-line); border-bottom: 1px solid var(--paper-line); }
table.grid tr.tot td { font-weight: 700; }
table.grid tr.tot td.num { border-top: 1px solid var(--paper-line); border-bottom: 3px double var(--paper-line); }
table.grid tr.memo td { color: var(--paper-muted); }
table.grid tr.indent td.lbl { padding-left: 22px; }
table.grid .status { color: var(--paper-muted); }
table.grid.fa thead th { white-space: normal; }
table.grid.fa th.num, table.grid.fa td.num { min-width: 96px; width: auto; }
table.grid.fa td.lbl { min-width: 170px; }
table.grid input.amt { background: #eef3fd; color: #1f4fbf; font-family: var(--font-sheet); }
table.grid input.amt.t { color: var(--paper-ink); }
table.grid input.amt:focus { background: #ffffff; border-color: #1f4fbf; }
table.grid input.lbl-in { color: var(--paper-ink); border-color: #9aa3a0; font-family: var(--font-sheet); }
table.grid .auto { color: #1d5b47; border-color: #1d5b47; }
table.grid .link { color: #1d5b47; }
table.grid .btn { background: #ffffff; color: var(--paper-ink); border-color: #9aa3a0; }
table.grid .rowx { color: #666666; }
td.calc { text-align: right; padding-right: 12px !important; }
.auto { display: inline-block; font-size: 10.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--accent); border: 1px solid var(--accent); border-radius: 4px; padding: 0 4px; margin-left: 6px; vertical-align: 1px; }
input.amt {
  width: 100%; min-width: 100px; text-align: right; border: 1px solid transparent; background: var(--entry-bg); color: var(--entry);
  border-radius: 4px; padding: 5px 6px; font-variant-numeric: tabular-nums;
}
input.amt:hover { border-color: var(--rule-strong); }
input.amt:focus { border-color: var(--entry); background: var(--sheet); outline: none; }
input.amt.t { text-align: left; color: var(--ink); }
input.lbl-in { width: 100%; min-width: 160px; border: 1px dashed var(--rule-strong); background: transparent; border-radius: 4px; padding: 4px 6px; }
.na { color: var(--muted); text-align: center; font-size: 12px; }
.rowx { border: 0; background: none; color: var(--muted); padding: 0 4px; font-size: 16px; line-height: 1; }
.rowx:hover { color: var(--bad); }
.addrow td { padding-block: 4px; }
.link { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; background: none; border: 0; padding: 0; }

.foot { padding: 12px 14px; display: grid; gap: 6px; }
.foot label { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
textarea { width: 100%; min-height: 70px; resize: vertical; line-height: 1.5; }
textarea.big { min-height: 260px; }

.form { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; padding: 16px; }
.field { display: grid; gap: 4px; min-width: 0; }
.field label { font-size: 12px; font-weight: 600; color: var(--muted); }
.field input, .field select { width: 100%; }
.check { display: flex; gap: 8px; align-items: flex-start; padding: 12px 16px; border-top: 1px solid var(--rule); }

/* Statements: set as a printed schedule */
.stmt { padding: 24px 26px; background: var(--paper-bg); color: var(--paper-ink); font-family: var(--font-sheet); font-size: 13.5px; border-radius: 10px; }
.stmt .ent { font-weight: 700; margin: 0; }
.stmt .ttl { font-weight: 700; margin: 0 0 4px; }
.stmt .unit { text-align: right; font-weight: 700; margin-bottom: 2px; }
table.st { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; border: 1px solid var(--paper-line); }
table.st th { text-align: center; border: 1px solid var(--paper-line); padding: 4px 8px; white-space: nowrap; font-weight: 700; }
table.st th:nth-child(1) { border-right: 0; }
table.st th:nth-child(2) { text-align: left; border-left: 0; }
table.st td { padding: 2px 8px; }
table.st td.tag { width: 46px; text-align: center; }
table.st td.lb { border-right: 1px solid var(--paper-line); }
table.st td.nt { width: 56px; text-align: center; border-right: 1px solid var(--paper-line); }
table.st td.v { width: 150px; text-align: right; border-left: 1px solid var(--paper-line); border-right: 1px solid var(--paper-line); }
table.st td.gap, table.st th.gap { width: 4px; padding: 0; border-top-color: transparent; border-bottom-color: transparent; }
table.st tr.h td { font-weight: 700; padding-top: 8px; }
table.st tr.s td.v { border-top: 1px solid var(--paper-line); border-bottom: 1px solid var(--paper-line); font-weight: 700; }
table.st tr.T td { font-weight: 700; }
table.st tr.T td.v { border-top: 1px solid var(--paper-line); border-bottom: 3px double var(--paper-line); }
table.st tr.rr td.lb { padding-left: 26px; }
table.st .link { color: var(--paper-ink); }
.stmt .status { color: var(--paper-muted); }
.sig { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 34px; font-size: 13px; }
.sig > div:last-child { text-align: right; }
.sig .line { margin-top: 36px; }
.accomp { margin-top: 14px; font-size: 13px; color: var(--muted); }

.checks { display: grid; gap: 8px; }
.chk { display: grid; grid-template-columns: 22px 1fr; gap: 8px; padding: 10px 14px; border-radius: 8px; }
.chk.ok { background: var(--good-soft); } .chk.bad { background: var(--bad-soft); } .chk.warn { background: var(--warn-soft); }
.chk .ic { font-weight: 700; }
.chk.ok .ic { color: var(--good); } .chk.bad .ic { color: var(--bad); } .chk.warn .ic { color: var(--warn); }

.tabs { display: inline-flex; border: 1px solid var(--rule-strong); border-radius: 8px; overflow: hidden; }
.tabs button { border: 0; background: var(--sheet); padding: 6px 14px; }
.tabs button.on { background: var(--accent); color: var(--sheet); }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.toast { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--sheet); padding: 10px 14px; border-radius: 8px; z-index: 50; max-width: 360px; }
.confirm { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 16px; background: var(--bad-soft); border-radius: 8px; }

#printArea { display: none; }
@media print {
  @page { size: A4 portrait; margin: 10mm 10mm 12mm; }
  @page land { size: A4 landscape; margin: 10mm 10mm 12mm; }
  body { background: #fff !important; }
  body::before, .top, .app, .toast { display: none !important; }
  #printArea { display: block; color: #000; font-family: "Trebuchet MS", "Lucida Grande", sans-serif; font-size: 10pt; }
  #printArea section.pp { break-after: page; }
  #printArea section.pp:last-child { break-after: auto; }
  #printArea section.landscape { page: land; }
  #printArea table { width: 100%; border-collapse: collapse; table-layout: fixed; }
  #printArea td { padding: 0.5pt 3pt; line-height: 1.2; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
}
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  nav.side { display: none; }
  .mobile-nav { display: block; width: 100%; }
  .mobile-nav select { width: 100%; }
  .stmt { padding: 18px 12px; min-width: 560px; }
  .top { position: static; }
  .brand small { display: none; }
  table.st td.v { width: 110px; }
  .sig { grid-template-columns: 1fr; }
  .sig > div:last-child { text-align: left; }
}
@media (prefers-reduced-motion: no-preference) { nav.side a, .btn { transition: background-color .12s, border-color .12s; } }
</style>

</head>
<body>
<header class="top">
  <div class="brand">NCE Statement Builder<small>ICAI format for non-corporate entities</small></div>
  <div class="entity-pick">
    <select id="entitySel" aria-label="Entity"></select>
    <button class="btn small" id="newEntityBtn">+ New</button>
  </div>
  <span class="status" id="saveStatus">Loading…</span>
  <span class="grow"></span>
  <button class="pill" id="checkPill">Checking…</button>
  <button class="btn" id="xlsBtn">Export Excel</button>
  <button class="btn" id="pdfBtn">Export PDF</button>
  <button class="btn" id="backupBtn">Backup</button>
  <label class="btn" for="restoreFile">Restore</label>
  <input type="file" id="restoreFile" accept=".json,application/json" hidden>
  <div class="mobile-nav"><select id="mobNav" aria-label="Go to"></select></div>
</header>
<div class="app">
  <nav class="side" id="sideNav"></nav>
  <main><div class="page" id="page"></div></main>
</div>
<div class="toast" id="toast" hidden></div>
<div id="printArea" aria-hidden="true"></div>

<script>
"use strict";
/* ---------------- helpers ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const num = v => { const n = typeof v === "number" ? v : parseFloat(v); return isFinite(n) ? n : 0; };
function parseAmt(s) {
  s = String(s).trim(); if (!s) return 0;
  let neg = /^\(.*\)$/.test(s) || s.startsWith("-");
  s = s.replace(/[(),\s₹-]/g, "");
  const n = parseFloat(s); return isFinite(n) ? (neg ? -n : n) : 0;
}
let DEC = 0;
function fmt(n, dash = true) {
  n = num(n); if (Math.abs(n) < 0.005) return dash ? "-" : "";
  const s = Math.abs(n).toLocaleString("en-US", { minimumFractionDigits: DEC, maximumFractionDigits: DEC });
  return n < 0 ? "-" + s : s;
}
function fmtIn(n) {
  n = num(n); if (Math.abs(n) < 0.0000001) return "";
  const s = Math.abs(n).toLocaleString("en-US", { maximumFractionDigits: 2 });
  return n < 0 ? "-" + s : s;
}
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
function dlabel(d) { return d.getDate() + " " + MONTHS[d.getMonth()] + " " + d.getFullYear(); }
function dates(S) {
  const cy = new Date((S.info.fyEnd || "2026-03-31") + "T00:00:00");
  const py = new Date(cy); py.setFullYear(cy.getFullYear() - 1);
  const pys = new Date(py); pys.setFullYear(py.getFullYear() - 1); pys.setDate(pys.getDate() + 1);
  const cys = new Date(py); cys.setDate(cys.getDate() + 1);
  return { cy: dlabel(cy), py: dlabel(py), pyStart: dlabel(pys), cyStart: dlabel(cys) };
}
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 3200); }

/* ---------------- note definitions ---------------- */
// row: {k,label,tag,sign,na:[cols],auto:fn(C)->{col:val},indent}; heading: {h,tag}
const r = (k, label, o = {}) => ({ k, label, ...o });
const h = (label, tag) => ({ h: label, tag });
const LOANS_ROWS = [
  h("Capital advances", "(a)"),
  r("cap_good", "Considered good", { indent: 1 }),
  r("cap_doubt", "Considered doubtful", { indent: 1 }),
  r("cap_prov", "Less: Provision for doubtful advances", { indent: 1, sign: -1 }),
  r("rel", "Loans and advances to partners / relatives of partners", { tag: "(b)" }),
  h("Other loans and advances (specify nature)", "(c)"),
  r("prepaid", "Prepaid expenses", { indent: 1 }),
  r("advtax", "Advance tax and tax deducted at source [net of provision for income tax]", { indent: 1 }),
  r("cenvat", "CENVAT credit receivable", { indent: 1 }),
  r("vat", "VAT credit receivable", { indent: 1 }),
  r("stax", "Service tax credit receivable", { indent: 1 }),
  r("gst", "GST input credit receivable", { indent: 1 }),
  r("sd", "Security deposits", { indent: 1 }),
  r("govt", "Balances with government authorities", { indent: 1 }),
];
const INV_OTHER = (cur) => [
  h("Other investments"),
  r("pref", "Investments in preference shares", { tag: "(c)" }),
  r("eq", "Investments in equity instruments", { tag: "(d)" }),
  r("govt", "Investments in government or trust securities", { tag: "(e)" }),
  r("deb", "Investments in debentures or bonds", { tag: "(f)" }),
  r("mf", "Investments in mutual funds", { tag: "(g)" }),
  r("prop", "Investment property", { tag: "(h)" }),
  r("oth", "Other non-current investments (specify nature)", { tag: "(i)" }),
];
const INV_TRADE = [
  r("ent", "Investments in other entities", { tag: "(a)" }),
  r("prov", "Less: Provision for diminution in value of investments", { sign: -1, indent: 1 }),
  r("firm", "Investments in partnership firms (give details below)", { tag: "(b)" }),
];
const CUR_INV = [
  r("cm", "Current maturities of long-term investments", { tag: "(a)" }),
  r("eq", "Investments in equity instruments", { tag: "(b)" }),
  r("pref", "Investments in preference shares", { tag: "(c)" }),
  r("govt", "Investments in government or trust securities", { tag: "(d)" }),
  r("deb", "Investments in debentures or bonds", { tag: "(e)" }),
  r("mf", "Investments in mutual funds", { tag: "(f)" }),
  r("oth", "Other short-term investments (specify nature)", { tag: "(g)" }),
];

const POLICIES = `2.1 Basis of preparation
The financial statements have been prepared under the historical cost convention on the accrual basis of accounting, in accordance with the generally accepted accounting principles in India and the Accounting Standards issued by the Institute of Chartered Accountants of India, as applicable to the entity.

2.2 Use of estimates
The preparation of financial statements requires management to make estimates and assumptions that affect the reported amounts of assets, liabilities, income and expenses. Differences between actual results and estimates are recognised in the period in which they are known.

2.3 Property, plant and equipment and depreciation
Property, plant and equipment are stated at cost less accumulated depreciation and impairment, if any. Depreciation is provided on the written down value method at the rates prescribed under the Income-tax Act, 1961 / based on the useful lives estimated by management.

2.4 Inventories
Inventories are valued at the lower of cost (on FIFO / weighted average basis) and net realisable value.

2.5 Revenue recognition
Revenue from sale of goods is recognised when significant risks and rewards of ownership are transferred to the buyer. Revenue from services is recognised as the services are rendered. Revenue is shown net of GST.

2.6 Investments
Long-term investments are carried at cost less provision for diminution, other than temporary, in value. Current investments are carried at the lower of cost and fair value.

2.7 Employee benefits
Contributions to defined contribution schemes are charged to the Statement of Profit and Loss. Gratuity and leave encashment are provided on the basis of actuarial valuation / as per management estimate.

2.8 Taxes on income
Current tax is determined as the amount of tax payable for the year. Deferred tax is recognised on timing differences between taxable and accounting income, subject to consideration of prudence.

2.9 Provisions and contingent liabilities
Provisions are recognised when there is a present obligation as a result of past events and it is probable that an outflow of resources will be required. Contingent liabilities are disclosed in the notes.`;

      C[`${note.id}.s.${sec.id}.${c}`] = st[c];

const rnd = x => { const f = Math.pow(10, DEC); return Math.round(x * f) / f; };

  const K = { t: { dep: 0, wdv: 0, open: 0 }, i: { dep: 0, wdv: 0, open: 0 } };
  for (const a of S.fa.assets) {
    const v = f => num(a[f]), rate = num(a.rate);
    const o = { open: v("open"), add1: v("add1"), add2: v("add2"), sale: v("sale") };
    o.add = o.add1 + o.add2;
    o.close = o.open + o.add - o.sale;
    // full rate on opening and additions used 180 days or more (less sales); half rate on later additions
    o.dep = rnd(Math.max(o.open + o.add1 - o.sale, 0) * rate / 100 + o.add2 * rate / 200);
    o.wdv = o.close - o.dep;
    for (const k in o) { C[`fa.${a.id}.${k}`] = o[k]; T[k] += o[k]; }
    const k = K[a.kind === "i" ? "i" : "t"]; k.dep += o.dep; k.wdv += o.wdv; k.open += o.open;
  }

  C["fa.py.open"] = pv("open"); C["fa.py.add"] = pv("add"); C["fa.py.sale"] = pv("sale"); C["fa.py.dep"] = pv("dep");
  C["fa.py.close"] = pv("open") + pv("add") - pv("sale"); C["fa.py.wdv"] = C["fa.py.close"] - pv("dep");

  C["ppe.tangible.net_cy"] = K.t.wdv; C["ppe.intangible.net_cy"] = K.i.wdv;
  C["ppe.tangible.net_py"] = K.t.open; C["ppe.intangible.net_py"] = K.i.open;
  C["ppe.tangible.dep_py"] = pv("dep"); C["ppe.intangible.dep_py"] = 0;
  for (const w of ["cwip", "iaud"]) {
    const v = f => num(S[w][f]);
    const py = v("open") + v("add_py") - v("cap_py");
    C[`${w}.open_py`] = v("open"); C[`${w}.close_py`] = py; C[`${w}.open_cy`] = py;

}
function compute() {
  C = {};
  DEC = num(S.info.dec);
  computePPE();
  for (const y of ["cy", "py"]) {
    for (const k of ["debtors", "creditors"]) C[`${k}.T.${y}`] = 0;
    for (const a of ["lt6", "gt6"]) for (const st of ["sec", "unsec", "doubt"]) C[`debtors.${a}.${st}.${y}`] = 0;
    C[`creditors.msme.${y}`] = 0; C[`creditors.oth.${y}`] = 0;
    for (const p of S.parties.debtors) { const v = num(p[y]); C[`debtors.${p.age || "lt6"}.${p.st || "unsec"}.${y}`] += v; C[`debtors.T.${y}`] += v; }
    for (const p of S.parties.creditors) { const v = num(p[y]); C[`creditors.${p.msme === "yes" ? "msme" : "oth"}.${y}`] += v; C[`creditors.T.${y}`] += v; }
  }
  for (const y of ["cy", "py"]) {
    C[`p.rem.${y}`] = S.partners.reduce((a, p) => a + num(p[y].rem), 0);
    C[`p.int.${y}`] = S.partners.reduce((a, p) => a + num(p[y].int), 0);
  }
  ["n6", "n19", "n20", "n21", "n22", "n23", "n24", "n25", "tx"].forEach(id => computeNote(NOTE_BY[id]));
  for (const y of ["cy", "py"]) {
    const g = k => C[k + "." + y] || 0;
    const P = {};
    P.rev = g("n19.t"); P.oi = g("n20.t"); P.ti = P.rev + P.oi;
    P.cogs = g("n21.t"); P.emp = g("n22.t"); P.fin = g("n23.t"); P.dep = g("n24.t"); P.oth = g("n25.t");
    P.exp = P.cogs + P.emp + P.fin + P.dep + P.oth;
    P.v = P.ti - P.exp;
    P.exc = g("tx.s.exc"); P.vii = P.v - P.exc;
    P.ext = g("tx.s.ext"); P.ix = P.vii - P.ext;
    P.rem = g("p.rem"); P.pbt = P.ix - P.rem;
    P.cur = g("tx.tax.cur"); P.ey = g("tx.tax.ey"); P.def = g("tx.tax.def"); P.tax = P.cur + P.ey + P.def;
    P.cont = P.pbt - P.tax;
    P.dp = g("tx.disc.profit"); P.dt = g("tx.disc.tax"); P.disc = P.dp - P.dt;
    P.profit = P.cont + P.disc;

    let close = 0, shareT = 0;
    S.partners.forEach(p => {
      const sh = y === "cy" ? num(p.share) : num(p.pshare ?? p.share);
      shareT += sh;
      const v = f => num(p[y][f]);
      const prof = S.allocate ? P.profit * sh / 100 : 0;
      const cl = v("open") + v("intro") + v("rem") + v("int") - v("wd") + prof;
      C[`p.${p.id}.share.${y}`] = prof; C[`p.${p.id}.close.${y}`] = cl;
      close += cl;
      for (const f of ["open", "intro", "rem", "int", "wd"]) C[`p.T.${f}.${y}`] = (C[`p.T.${f}.${y}`] || 0) + v(f);
    });
    C[`p.T.share.${y}`] = S.allocate ? S.partners.reduce((a, p) => a + C[`p.${p.id}.share.${y}`], 0) : 0;
    C[`p.T.close.${y}`] = close; C[`p.shareT.${y}`] = shareT;
  }
  NOTES.filter(n => !["n6", "n19", "n20", "n21", "n22", "n23", "n24", "n25", "tx"].includes(n.id)).forEach(computeNote);
  for (const y of ["cy", "py"]) {
    const g = k => C[k] || 0;

    B.ltb = g(`n5a.t.${y}`); B.dtl = Math.max(dt, 0); B.oltl = g(`n7.t.${y}`); B.ltp = g(`n8.t.lt_${y}`);

    B.stb = g(`n5b.t.${y}`); B.tp = g(`n9.t.${y}`); B.ocl = g(`n10.t.${y}`); B.stp = g(`n8.t.st_${y}`);
    B.cl = B.stb + B.tp + B.ocl + B.stp;

    B.as = B.nca + B.ca;

}

/* ---------------- checks ---------------- */
function checks() {
  const out = [], d = dates(S), e = 0.5 / Math.pow(10, DEC);
  for (const y of ["cy", "py"]) {
    const df = C[`bs.diff.${y}`];
    out.push(Math.abs(df) < e
      ? { s: "ok", t: `Balance Sheet as at ${d[y]} tallies.` }
      : { s: "bad", t: `Balance Sheet as at ${d[y]} does not tally. Equity and liabilities exceed assets by ${fmt(df)}. Check the notes for missing or misplaced figures.`, go: "bs" });
  }
  if (S.allocate && S.partners.length) for (const y of ["cy", "py"]) {
    const t = C[`p.shareT.${y}`];
    if (Math.abs(t - 100) > 0.001) out.push({ s: "bad", t: `Profit-sharing ratios for ${y === "cy" ? "the current year" : "the previous year"} add up to ${t}%, not 100%. Part of the profit is not credited to any owner.`, go: "n3" });
  }
  S.partners.forEach(p => {
    const pyc = C[`p.${p.id}.close.py`], cyo = num(p.cy.open);
    if (Math.abs(pyc - cyo) >= e && (Math.abs(pyc) >= e || Math.abs(cyo) >= e))
      out.push({ s: "warn", t: `${p.name || "Unnamed owner"}: opening capital this year (${fmt(cyo)}) differs from last year's closing capital (${fmt(pyc)}).`, go: "n3" });
  });
  const clos = y => ["rm", "pm", "om"].reduce((a, s) => a + (C[`n21.${s}.close.${y}`] || 0), 0) + ["c_sit", "c_wip", "c_fg"].reduce((a, k) => a + (C[`n21.chg.${k}.${y}`] || 0), 0);
  for (const y of ["cy", "py"]) {
    const a = C[`n15.t.${y}`], b = clos(y);
    if (Math.abs(a - b) >= e && b !== 0) out.push({ s: "warn", t: `Closing stock used in Cost of goods sold (${fmt(b)}) differs from Inventories in Note ${NN("n15")} (${fmt(a)}) as at ${d[y]}. Differences can be valid (stores, loose tools).`, go: "n15" });
  }
  const opn = ["rm", "pm", "om"].reduce((a, s) => a + (C[`n21.${s}.open.cy`] || 0), 0) + ["o_sit", "o_wip", "o_fg"].reduce((a, k) => a + (C[`n21.chg.${k}.cy`] || 0), 0);
  const pyc = clos("py");
  if (pyc !== 0 && Math.abs(opn - pyc) >= e) out.push({ s: "warn", t: `Opening stock this year (${fmt(opn)}) differs from closing stock last year (${fmt(pyc)}) in Note ${NN("n21")}.`, go: "n21" });
  if (C["bs.dtl.cy"] > 0 && C["bs.dta.cy"] > 0) out.push({ s: "warn", t: "Deferred tax shows both an asset and a liability." });
  if ((Math.abs(C["fa.py.wdv"]) >= e || Math.abs(C["fa.T.open"]) >= e) && Math.abs(C["fa.py.wdv"] - C["fa.T.open"]) >= e)
    out.push({ s: "warn", t: `Previous-year W.D.V. in the fixed asset schedule (${fmt(C["fa.py.wdv"])}) differs from this year's opening balance (${fmt(C["fa.T.open"])}).`, go: "n11" });
  const norate = S.fa.assets.filter(a => !num(a.rate) && FA_F.some(f => num(a[f])));
  if (norate.length) out.push({ s: "warn", t: `No depreciation rate entered for ${norate.map(a => a.name || "an unnamed asset").join(", ")}.`, go: "n11" });
  return out;
}

function pasteParties(kind) {
  const ta = $("#paste_" + kind); if (!ta) return;
  let n = 0;
  for (const line of ta.value.split(/\r?\n/)) {
    const c = line.split("\t").map(x => x.trim());
    if (c.length < 2 || !c[0] || /^(party|particulars|name|total|grand total)/i.test(c[0])) continue;
    const cy = parseAmt(c[1]);
    if (!cy && !parseAmt(c[3] || "")) continue;
    S.parties[kind].push(kind === "debtors" ? { id: uid(), name: c[0], grp: c[2] || "", age: "lt6", st: "unsec", cy, py: parseAmt(c[3] || "") }
      : { id: uid(), name: c[0], grp: c[2] || "", msme: /msme|micro|small/i.test(c[2] || "") ? "yes" : "no", cy, py: parseAmt(c[3] || "") });
    n++;
  }
  ta.value = "";
  touch(); render();
  toast(n ? `Added ${n} part${n > 1 ? "ies" : "y"}.` : "No rows found. Each line needs a name and an amount separated by a tab.");
}

/* Notes sheet (portrait): A tag | B particulars | C–G five amount columns; each note boxed with vertical rules */

    { h: 28, cells: [cell(2, note.lead || "", { i: true, va: "middle" }), hd(3, "Face value"), hd(4, "Nos. / units"), hd(5, "Book value"), hd(6, "Nos. / units"), hd(7, "Book value")] }];

    for (const { row } of keep) {

/* ---------------- PDF export: the Excel layout drawn as A4 HTML pages, then printed ---------------- */
// HSheet takes the same row specs as XSheet, so the PDF matches the workbook page for page
class HSheet {
  constructor(wb, name, widths, opt) {
    this.W = widths; this.N = widths.length; this.avail = opt.avail; this.orient = opt.orient;
    this.titleRows = opt.titles ? +String(opt.titles).split(":")[1] : 0;
    this.r = 0; this.used = 0; this.body = 0; this.titles = []; this.pages = [[]];
    wb.sheets.push(this);
  }
  pageBreak() { if (this.r > this.body) { this.pages.push([...this.titles]); this.used = 0; } }
  row(spec) {
    const h = spec.h || RH;
    if (this.used + h > this.avail) this.pageBreak();
    this.r++;
    const cells = Array.from({ length: this.N }, () => ({ html: "", span: 1, st: [], b: {} }));
    const skip = new Set();
    for (const c of spec.cells || []) {
      const last = c.to || c.c, x = cells[c.c - 1];
      for (let k = c.c + 1; k <= last; k++) skip.add(k);
      x.span = last - c.c + 1;
      x.html = hval(c);
      const isNum = typeof c.v === "number";
      x.st.push(`text-align:${c.al || (isNum ? "right" : "left")}`, `vertical-align:${c.va === "middle" ? "middle" : c.va === "bottom" ? "bottom" : "top"}`);
      if (c.b) x.st.push("font-weight:700"); if (c.i) x.st.push("font-style:italic"); if (c.u) x.st.push("text-decoration:underline");
      if (c.sz) x.st.push(`font-size:${c.sz}pt`); if (c.ind) x.st.push(`padding-left:${4 + c.ind * 9}pt`);
      if (c.box) { x.b.top = x.b.bottom = x.b.left = x.b.right = "solid"; }
      if (c.bt) x.b.top = "solid";
      if (c.bb) x.b.bottom = c.bb === 2 ? "double" : "solid";
      x.last = last;
    }
    if (spec.frame) {
      const [a, b] = spec.frame.span || [1, this.N];
      const owner = k => { for (let j = k; j >= 1; j--) if (!skip.has(j)) return j; return k; };
      for (const k of spec.frame.l || []) { const o = owner(k); if (o === k) cells[k - 1].b.left = "solid"; }
      for (const k of spec.frame.r || []) { const o = owner(k); const x = cells[o - 1]; if ((x.last || o) === k) x.b.right = "solid"; }
      for (let k = a; k <= b; k++) if (!skip.has(k)) { if (spec.top) cells[k - 1].b.top ||= "solid"; if (spec.bottom) cells[k - 1].b.bottom ||= "solid"; }
    }
    const tds = cells.map((x, i) => {
      if (skip.has(i + 1)) return "";
      const bs = ["top", "bottom", "left", "right"].filter(s => x.b[s]).map(s => `border-${s}:${x.b[s] === "double" ? "2.5pt double" : "0.75pt solid"} #000`);
      return `<td${x.span > 1 ? ` colspan="${x.span}"` : ""} style="${[...x.st, ...bs].join(";")}">${x.html}</td>`;
    }).join("");
    const tr = `<tr style="height:${h}pt">${tds}</tr>`;
    this.pages[this.pages.length - 1].push(tr);
    if (this.r <= this.titleRows) this.titles.push(tr);
    this.used += h;
  }
  block(rows) {
    const tot = rows.reduce((a, r) => a + (r.h || RH), 0);
    if (this.used > 0 && this.used + tot > this.avail && (tot <= this.avail || this.avail - this.used < this.avail * 0.4)) this.pageBreak();
    rows.forEach(r => this.row(r));
  }
  gap(h = 10) { if (this.used > 0 && this.used + h <= this.avail) this.row({ h }); }
  html() {
    const tot = this.W.reduce((a, b) => a + b, 0);
    const cols = `<colgroup>${this.W.map(w => `<col style="width:${(w / tot * 100).toFixed(3)}%">`).join("")}</colgroup>`;
    return this.pages.filter(p => p.length).map(p => `<section class="pp ${this.orient}"><table>${cols}${p.join("")}</table></section>`).join("");
  }
}
function hval(c) {
  const v = c.v;
  if (v === undefined || v === null || v === "") return "";
  if (typeof v !== "number") return esc(v).replace(/\n/g, "<br>");
  if (c.fmt === '0.00"%"') return v.toFixed(2) + "%";
  if (c.fmt === "0.00%") return (v * 100).toFixed(2) + "%";
  if (c.fmt === "0") return String(Math.round(v));
  if (c.fmt === "General" || c.fmt === "0.##") return String(+v.toFixed(2));
  return fmt(v);
}

function mkSheet(wb, name, widths, opt) { return wb.html ? new HSheet(wb, name, widths, opt) : new XSheet(wb, name, widths, opt); }

  V("n8", "a.tax", { st_cy: 65000, st_py: 40000 });
  V("n13", "unsec.sd", { lt_cy: 100000, lt_py: 100000 }); V("n13", "unsec.prepaid", { st_cy: 12000, st_py: 10000 }); 
  V("n15", "a.sit", 720000, 640000);
  s.parties.debtors = [
    { id: "d1", name: "Patel Electricals", grp: "Retail dealers", age: "lt6", st: "unsec", cy: 420000, py: 380000 },
    { id: "d2", name: "Shiv Shakti Traders", grp: "Retail dealers", age: "lt6", st: "unsec", cy: 310000, py: 260000 },
    { id: "d3", name: "Om Projects Pvt Ltd", grp: "Contractors", age: "lt6", st: "unsec", cy: 250000, py: 220000 },
    { id: "d4", name: "Ganesh Electric Works", grp: "Contractors", age: "gt6", st: "unsec", cy: 60000, py: 45000 }];
  V("n17", "cce.cur", 0, 0); V("n17", "cce.cash", 38000, 31000); V("n17", "obb.fd12", 300000, 250000);
  V("n18", "a.ind", 9000, 7000);
  const fa = { "Furniture & Fixtures": { open: 170000 }, "Office Equipment": { open: 126000, add1: 25000 }, "Motor Car": { open: 425000 },
    "Computer & Printer": { open: 18000, add2: 30000 }, "Computer Software": { open: 24000 } };
  s.fa.assets.forEach(a => Object.assign(a, fa[a.name] || {}));
  s.fa.py = { open: 900000, add: 40000, sale: 0, dep: 177000 };
  return s;
}
function setVs(s, n, rk, c, v) {
  if (typeof c === "object") { for (const k in c) setVs(s, n, rk, k, c[k]); return; }
  if (v && typeof v === "object") { for (const k in v) setVs(s, n, rk, k, v[k]); return; }
  ((s.vals[n] ||= {})[rk] ||= {})[c] = v;
}
// make the example tally: carry previous-year closing capital forward and balance through the bank account
function balanceSample(s) {
  const keep = S; S = s; compute();
  s.partners.forEach(p => p.cy.open = Math.round(C[`p.${p.id}.close.py`]));
  for (const y of ["py", "cy"]) { compute(); setVs(s, "n17", "cce.cur", y, num(getV("n17", "cce.cur", y)) + Math.round(C[`bs.diff.${y}`])); }
  compute(); S = keep; return s;
}
function normalize(s) {
  const b = blankState();
  s.info = { ...b.info, ...s.info }; s.vals ||= {}; s.extra ||= {}; s.text ||= {}; s.cwip ||= {}; s.iaud ||= {};
  s.parties ||= {}; s.parties.debtors ||= []; s.parties.creditors ||= [];
  migrateBorrowings(s); migrateFixedAssets(s, b);
  s.partners ||= []; s.partners.forEach(p => { p.cy ||= {}; p.py ||= {}; }); if (s.allocate === undefined) s.allocate = true;
  return s;
}

// earlier versions kept borrowings in one ICAI-style grid; split them into lender-wise lines
function migrateBorrowings(s) {
  const old = s.vals.n5; if (!old) return;
  const L = { tl_bank: "Term loans from banks", tl_oth: "Term loans from other parties", od_bank: "Loans repayable on demand from banks", od_oth: "Loans repayable on demand from other parties",
    dpl: "Deferred payment liabilities", rp: "Loans and advances from related parties", fl: "Finance lease obligations", oth: "Other loans and advances" };
  for (const sec of ["sec", "unsec"]) {
    const ex = Object.fromEntries((s.extra["n5." + sec] || []).map(e => ["x_" + e.id, e.label]));
    for (const [rk, v] of Object.entries(old)) {
      const [sc, k] = rk.split("."); if (sc !== sec) continue;
      const label = L[k] || ex[k] || "Loan";
      for (const [note, a, b] of [["n5a", "lt_cy", "lt_py"], ["n5b", "st_cy", "st_py"]]) {
        if (!num(v[a]) && !num(v[b])) continue;
        const id = uid(); (s.extra[note + "." + sec] ||= []).push({ id, label });
        ((s.vals[note] ||= {})[sec + ".x_" + id] = { cy: num(v[a]), py: num(v[b]) });
      }
    }
    delete s.extra["n5." + sec];
  }
  if (s.text.n5) { s.text.n5a = s.text.n5; delete s.text.n5; }
  delete s.vals.n5;
}
// earlier versions kept a gross-block grid; carry each class over as a W.D.V. block (rates to be filled in)
function migrateFixedAssets(s, b) {
  if (s.fa) { s.fa.py ||= {}; s.fa.assets ||= []; return; }
  if (!s.ppe) { s.fa = b.fa; return; }
  const assets = [], py = { open: 0, add: 0, sale: 0, dep: 0 };
  for (const [kind, k] of [["tangible", "t"], ["intangible", "i"]]) for (const c of s.ppe[kind] || []) {
    const v = f => num(s.ppeV?.[c.id]?.[f]);
    const openWdv = (v("g_open") + v("g_add_py") - v("g_ded_py")) - (v("d_open") + v("d_chg_py") - v("d_ded_py"));
    py.open += v("g_open") - v("d_open"); py.add += v("g_add_py"); py.sale += v("g_ded_py") - v("d_ded_py"); py.dep += v("d_chg_py");
    if (openWdv || v("g_add_cy") || v("g_ded_cy")) assets.push({ id: uid(), name: c.name, kind: k, rate: 0, open: openWdv, add1: v("g_add_cy"), sale: v("g_ded_cy") - v("d_ded_cy") });
  }
  s.fa = { assets: assets.length ? assets : b.fa.assets, py };
  delete s.ppe; delete s.ppeV;
}

/* ---------------- boot ---------------- */
function boot() {
  const saved = lsLoad();
  if (saved?.ents && Object.keys(saved.ents).length) {
    ENT = Object.fromEntries(Object.entries(saved.ents).map(([k, v]) => [k, normalize(v)]));
    S = ENT[saved.cur] || Object.values(ENT)[0];
  } else { const s = balanceSample(sampleState()); ENT = { [s.id]: s }; S = s; }
  route = location.hash.slice(1) || "info";
  render();
  setStatus("Saved on this device");
  connectDb();
}
async function connectDb() {
  if (!window.claude?.use) { dbReady = true; setStatus("Saved in this browser"); return; }
  try {
    const [d, u] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    dbReady = true;
    if (!d || !u) { setStatus("Saved in this browser"); return; }
    const id = await u.id();
    if (!id) { setStatus("Saved in this browser"); return; }
    db = d; dbUid = id;
    const snap = await db.collection("data/users/" + id).get();
    let changed = false;
    for (const doc of snap.docs) {
      const row = doc.data(); if (!row?.data) continue;
      let st; try { st = normalize(JSON.parse(row.data)); } catch { continue; }
      if (!ENT[st.id] || (ENT[st.id].updatedAt || 0) < (st.updatedAt || 0)) { ENT[st.id] = st; changed = true; }
    }
    // drop the untouched example if the account already has real entities
    if (snap.docs.length) for (const e of Object.values(ENT)) if (e.isSample && Object.keys(ENT).length > 1) { delete ENT[e.id]; changed = true; }
    // push local entities the account does not have yet
    const have = new Set(snap.docs.map(x => x.id));
    for (const e of Object.values(ENT)) if (!have.has(e.id) && !e.isSample)
      await db.collection("data/users/" + id).doc(e.id).set({ name: e.info.name, updatedAt: e.updatedAt, data: JSON.stringify(e) });
    if (changed) { if (!ENT[S.id]) S = Object.values(ENT)[0]; lsSave(); render(); }
    setStatus("Saved to your account");
  } catch (e) { setStatus("Saved in this browser"); }
}
boot();
