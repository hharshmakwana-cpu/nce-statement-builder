<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Prepare the Balance Sheet, Statement of Profit and Loss and notes for non-corporate entities in the ICAI format. Export to Excel and PDF.">
<meta name="theme-color" content="#1d5b47">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); color-scheme: light; }
body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
img { max-width: 100%; }
[hidden] { display: none !important; }
</style>
<title>NCE Statement Builder</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:ital,opsz,wght@0,8..60,500;0,8..60,600;0,8..60,700;1,8..60,400&family=Carlito:ital,wght@0,400;0,700;1,400&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/exceljs/4.4.0/exceljs.min.js"></script>
<style>
/* Layout: ledger workbook. Fixed left index of notes, working sheet on the right; statements set like a printed schedule. */
:root {
  --paper: #fafbf9;
  --sheet: #ffffff;
  --ink: #1b2420;
  --muted: #5d6a64;
  --rule: #dfe5e1;
  --rule-strong: #b9c4be;
  --accent: #1d5b47;
  --accent-soft: #e5efea;
  --entry: #1f4fbf;          /* blue ink = typed figure, the spreadsheet convention */
  --entry-bg: #f3f6fd;
  --good: #1f7a4a;
  --warn: #9a6100;
  --bad: #b3261e;
  --bad-soft: #fbeceb;
  --warn-soft: #fbf3e2;
  --good-soft: #e6f3eb;
  --font-ui: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-doc: "Source Serif 4", Georgia, "Times New Roman", serif;
  --font-sheet: "Trebuchet MS", "Lucida Grande", "Segoe UI", sans-serif;
  --paper-bg: #ffffff;
  --paper-ink: #000000;
  --paper-line: #000000;
  --paper-muted: #444444;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --paper: #111614; --sheet: #171d1a; --ink: #e3e9e5; --muted: #95a39c;
    --rule: #28312d; --rule-strong: #3c4842; --accent: #7cc4a6; --accent-soft: #1d2c26;
    --entry: #8fb1ff; --entry-bg: #1a2130; --good: #6fcf97; --warn: #e2b04a; --bad: #ff8a80;
    --bad-soft: #3a1f1d; --warn-soft: #33290f; --good-soft: #17301f; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --paper: #111614; --sheet: #171d1a; --ink: #e3e9e5; --muted: #95a39c;
  --rule: #28312d; --rule-strong: #3c4842; --accent: #7cc4a6; --accent-soft: #1d2c26;
  --entry: #8fb1ff; --entry-bg: #1a2130; --good: #6fcf97; --warn: #e2b04a; --bad: #ff8a80;
  --bad-soft: #3a1f1d; --warn-soft: #33290f; --good-soft: #17301f; color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-ui); font-size: 14px; line-height: 1.45; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--sheet); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }

.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  background: var(--sheet); border-bottom: 1px solid var(--rule);
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center;
}
.brand { font-family: var(--font-doc); font-weight: 600; font-size: 17px; letter-spacing: .01em; margin-right: 4px; }
.brand small { font-family: var(--font-ui); font-weight: 400; color: var(--muted); font-size: 12px; margin-left: 6px; }
.top .grow { flex: 1 1 auto; }
.entity-pick { display: flex; gap: 6px; align-items: center; min-width: 0; }
.entity-pick select { max-width: 240px; }
select, .btn, input.txt, textarea {
  border: 1px solid var(--rule-strong); background: var(--sheet); border-radius: 6px; padding: 6px 10px;
}
.btn { background: var(--sheet); white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); color: var(--sheet); border-color: var(--accent); }
.btn.danger { color: var(--bad); border-color: var(--bad); }
.btn.small { padding: 3px 8px; font-size: 12.5px; }
.status { color: var(--muted); font-size: 12.5px; }
.pill { display: inline-flex; gap: 6px; align-items: center; padding: 4px 10px; border-radius: 999px; font-size: 12.5px; font-weight: 500; border: 0; }
.pill.ok { background: var(--good-soft); color: var(--good); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }

.app { display: grid; grid-template-columns: 250px minmax(0, 1fr); min-height: calc(100vh - 60px); }
nav.side {
  border-right: 1px solid var(--rule); background: var(--sheet); padding: 14px 10px 40px;
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + 57px); align-self: start;
  height: calc(100vh - 57px); overflow-y: auto;
}
nav.side h4 { margin: 14px 8px 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); font-weight: 600; }
nav.side a { display: grid; grid-template-columns: 34px 1fr; gap: 4px; padding: 5px 8px; border-radius: 6px; color: var(--ink); text-decoration: none; font-size: 13.5px; }
nav.side a .no { color: var(--muted); font-variant-numeric: tabular-nums; }
nav.side a:hover { background: var(--accent-soft); }
nav.side a.on { background: var(--accent); color: var(--sheet); }
nav.side a.on .no { color: inherit; opacity: .8; }
.mobile-nav { display: none; }

main {
  padding-block: 20px 80px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  min-width: 0;
}
.page { max-width: 1100px; margin: 0 auto; display: grid; gap: 18px; }
.page-head { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: baseline; justify-content: space-between; }
.page-head h1 { font-family: var(--font-doc); font-weight: 600; font-size: 24px; margin: 0; text-wrap: balance; }
.page-head h1 .nno { color: var(--accent); margin-right: 8px; }
.lead { color: var(--muted); margin: 0; max-width: 70ch; }
.banner { background: var(--warn-soft); color: var(--ink); border-radius: 8px; padding: 10px 14px; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.banner b { color: var(--warn); }

.sheet { background: var(--sheet); border: 1px solid var(--rule); border-radius: 4px; }
.scroll { overflow-x: auto; }
table.grid { border-collapse: collapse; width: 100%; font-family: var(--font-sheet); font-size: 13.5px; color: var(--paper-ink); background: var(--paper-bg); font-variant-numeric: tabular-nums; border: 1px solid var(--paper-line); }
table.grid th, table.grid td { padding: 3px 7px; text-align: left; vertical-align: middle; }
table.grid thead th { font-weight: 700; color: var(--paper-ink); border: 1px solid var(--paper-line); white-space: nowrap; text-align: center; }
table.grid thead th:nth-child(2) { text-align: left; }
table.grid thead tr.grp th:empty { border-top-color: transparent; border-left-color: transparent; }
table.grid th.num, table.grid td.num { text-align: right; width: 150px; min-width: 120px; border-left: 1px solid var(--paper-line); border-right: 1px solid var(--paper-line); }
table.grid td.tag { width: 40px; color: var(--paper-ink); white-space: nowrap; text-align: center; border-right: 1px solid var(--paper-line); }
table.grid tr.sec td { font-weight: 700; text-decoration: underline; padding-top: 10px; }
table.grid tr.sec td.num, table.grid tr.hd td.num { text-decoration: none; }
table.grid tr.hd td { font-weight: 700; }
table.grid tr.sub td { font-weight: 700; }
table.grid tr.sub td.num { border-top: 1px solid var(--paper-line); border-bottom: 1px solid var(--paper-line); }
table.grid tr.tot td { font-weight: 700; }
table.grid tr.tot td.num { border-top: 1px solid var(--paper-line); border-bottom: 3px double var(--paper-line); }
table.grid tr.memo td { color: var(--paper-muted); }
table.grid tr.indent td.lbl { padding-left: 22px; }
table.grid .status { color: var(--paper-muted); }
table.grid.fa thead th { white-space: normal; }
table.grid.fa th.num, table.grid.fa td.num { min-width: 96px; width: auto; }
table.grid.fa td.lbl { min-width: 170px; }
table.grid input.amt { background: #eef3fd; color: #1f4fbf; font-family: var(--font-sheet); }
table.grid input.amt.t { color: var(--paper-ink); }
table.grid input.amt:focus { background: #ffffff; border-color: #1f4fbf; }
table.grid input.lbl-in { color: var(--paper-ink); border-color: #9aa3a0; font-family: var(--font-sheet); }
table.grid .auto { color: #1d5b47; border-color: #1d5b47; }
table.grid .link { color: #1d5b47; }
table.grid .btn { background: #ffffff; color: var(--paper-ink); border-color: #9aa3a0; }
table.grid .rowx { color: #666666; }
td.calc { text-align: right; padding-right: 12px !important; }
.auto { display: inline-block; font-size: 10.5px; font-weight: 600; letter-spacing: .05em; text-transform: uppercase; color: var(--accent); border: 1px solid var(--accent); border-radius: 4px; padding: 0 4px; margin-left: 6px; vertical-align: 1px; }
input.amt {
  width: 100%; min-width: 100px; text-align: right; border: 1px solid transparent; background: var(--entry-bg); color: var(--entry);
  border-radius: 4px; padding: 5px 6px; font-variant-numeric: tabular-nums;
}
input.amt:hover { border-color: var(--rule-strong); }
input.amt:focus { border-color: var(--entry); background: var(--sheet); outline: none; }
input.amt.t { text-align: left; color: var(--ink); }
input.lbl-in { width: 100%; min-width: 160px; border: 1px dashed var(--rule-strong); background: transparent; border-radius: 4px; padding: 4px 6px; }
.na { color: var(--muted); text-align: center; font-size: 12px; }
.rowx { border: 0; background: none; color: var(--muted); padding: 0 4px; font-size: 16px; line-height: 1; }
.rowx:hover { color: var(--bad); }
.addrow td { padding-block: 4px; }
.link { color: var(--accent); text-decoration: underline; text-underline-offset: 2px; cursor: pointer; background: none; border: 0; padding: 0; }

.foot { padding: 12px 14px; display: grid; gap: 6px; }
.foot label { font-size: 12px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
textarea { width: 100%; min-height: 70px; resize: vertical; line-height: 1.5; }
textarea.big { min-height: 260px; }

.form { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; padding: 16px; }
.field { display: grid; gap: 4px; min-width: 0; }
.field label { font-size: 12px; font-weight: 600; color: var(--muted); }
.field input, .field select { width: 100%; }
.check { display: flex; gap: 8px; align-items: flex-start; padding: 12px 16px; border-top: 1px solid var(--rule); }

/* Statements: set as a printed schedule */
.stmt { padding: 24px 26px; background: var(--paper-bg); color: var(--paper-ink); font-family: var(--font-sheet); font-size: 13.5px; border-radius: 10px; }
.stmt .ent { font-weight: 700; margin: 0; }
.stmt .ttl { font-weight: 700; margin: 0 0 4px; }
.stmt .unit { text-align: right; font-weight: 700; margin-bottom: 2px; }
table.st { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; border: 1px solid var(--paper-line); }
table.st th { text-align: center; border: 1px solid var(--paper-line); padding: 4px 8px; white-space: nowrap; font-weight: 700; }
table.st th:nth-child(1) { border-right: 0; }
table.st th:nth-child(2) { text-align: left; border-left: 0; }
table.st td { padding: 2px 8px; }
table.st td.tag { width: 46px; text-align: center; }
table.st td.lb { border-right: 1px solid var(--paper-line); }
table.st td.nt { width: 56px; text-align: center; border-right: 1px solid var(--paper-line); }
table.st td.v { width: 150px; text-align: right; border-left: 1px solid var(--paper-line); border-right: 1px solid var(--paper-line); }
table.st td.gap, table.st th.gap { width: 4px; padding: 0; border-top-color: transparent; border-bottom-color: transparent; }
table.st tr.h td { font-weight: 700; padding-top: 8px; }
table.st tr.s td.v { border-top: 1px solid var(--paper-line); border-bottom: 1px solid var(--paper-line); font-weight: 700; }
table.st tr.T td { font-weight: 700; }
table.st tr.T td.v { border-top: 1px solid var(--paper-line); border-bottom: 3px double var(--paper-line); }
table.st tr.rr td.lb { padding-left: 26px; }
table.st .link { color: var(--paper-ink); }
.stmt .status { color: var(--paper-muted); }
.sig { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin-top: 34px; font-size: 13px; }
.sig > div:last-child { text-align: right; }
.sig .line { margin-top: 36px; }
.accomp { margin-top: 14px; font-size: 13px; color: var(--muted); }

.checks { display: grid; gap: 8px; }
.chk { display: grid; grid-template-columns: 22px 1fr; gap: 8px; padding: 10px 14px; border-radius: 8px; }
.chk.ok { background: var(--good-soft); } .chk.bad { background: var(--bad-soft); } .chk.warn { background: var(--warn-soft); }
.chk .ic { font-weight: 700; }
.chk.ok .ic { color: var(--good); } .chk.bad .ic { color: var(--bad); } .chk.warn .ic { color: var(--warn); }

.tabs { display: inline-flex; border: 1px solid var(--rule-strong); border-radius: 8px; overflow: hidden; }
.tabs button { border: 0; background: var(--sheet); padding: 6px 14px; }
.tabs button.on { background: var(--accent); color: var(--sheet); }
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.toast { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--sheet); padding: 10px 14px; border-radius: 8px; z-index: 50; max-width: 360px; }
.confirm { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; padding: 10px 16px; background: var(--bad-soft); border-radius: 8px; }

#printArea { display: none; }
.fsdoc table, #printArea table { width: 100%; border-collapse: collapse; table-layout: fixed; }
.fsdoc td, #printArea td { padding: 0.6pt 3pt; line-height: 1.2; overflow-wrap: anywhere; font-variant-numeric: tabular-nums; }
.fsdoc { background: #fff; color: #000; font-family: Carlito, Calibri, "Segoe UI", Arial, sans-serif; font-size: 10pt; padding: 22px 26px; border-radius: 4px; }
@media print {
  @page { size: A4 portrait; margin: 0; }
  html, body { background: #fff !important; padding: 0 !important; }
  body::before, .top, .app, .toast { display: none !important; }
  #printArea { display: block; color: #000; font-family: Carlito, Calibri, "Segoe UI", Arial, sans-serif; font-size: 10pt; }
  #printArea section.pp { width: 210mm; padding: 12mm 12mm 0 14mm; box-sizing: border-box; break-after: page; page-break-after: always; }
  #printArea section.pp:last-child { break-after: auto; page-break-after: auto; }
  #printArea section.land { height: 297mm; overflow: hidden; }
  #printArea section.land .rot { width: 273mm; height: 184mm; transform-origin: top left; transform: translate(0, 273mm) rotate(-90deg); }
  #printArea section.cover { height: 297mm; padding: 14mm; }
  .cv { height: 100%; box-sizing: border-box; border: 2.4pt double #000; padding: 22mm 18mm 16mm; display: flex; flex-direction: column; font-family: Carlito, Calibri, sans-serif; }
  .cv-fy { letter-spacing: 0.25em; font-weight: 700; font-size: 10pt; }
  .cv-name { font-family: "Source Serif 4", Cambria, Georgia, serif; font-weight: 700; font-size: 30pt; line-height: 1.15; margin-top: 10mm; }
  .cv-rule { width: 16mm; height: 2.2mm; background: #000; margin: 10mm 0 4mm; }
  .cv-reg { font-size: 11pt; letter-spacing: 0.06em; }
  .cv-mid { margin-top: auto; }
  .cv-aud { font-family: "Source Serif 4", Cambria, Georgia, serif; font-style: italic; font-size: 20pt; }
  .cv-title { font-family: "Source Serif 4", Cambria, Georgia, serif; font-weight: 700; font-size: 30pt; margin-top: 2mm; }
  .cv-for { font-size: 12pt; margin-top: 5mm; }
  .cv-foot { margin-top: auto; border-top: 0.8pt solid #000; padding-top: 7mm; }
  .cv-lab { letter-spacing: 0.25em; font-weight: 700; font-size: 9pt; }
  .cv-firm { font-family: "Source Serif 4", Cambria, Georgia, serif; font-weight: 700; font-size: 17pt; margin-top: 4mm; }
  .cv-ca { font-size: 10.5pt; margin-top: 2mm; }
}
@media (max-width: 860px) {
  .app { grid-template-columns: minmax(0, 1fr); }
  nav.side { display: none; }
  .mobile-nav { display: block; width: 100%; }
  .mobile-nav select { width: 100%; }
  .stmt { padding: 18px 12px; min-width: 560px; }
  .top { position: static; }
  .brand small { display: none; }
  table.st td.v { width: 110px; }
  .sig { grid-template-columns: 1fr; }
  .sig > div:last-child { text-align: left; }
}
@media (prefers-reduced-motion: no-preference) { nav.side a, .btn { transition: background-color .12s, border-color .12s; } }
</style>

</head>
<body>
<header class="top">
  <div class="brand">NCE Statement Builder<small>ICAI format for non-corporate entities</small></div>
  <div class="entity-pick">
    <select id="entitySel" aria-label="Entity"></select>
    <button class="btn small" id="newEntityBtn">+ New</button>
  </div>
  <span class="status" id="saveStatus">Loading…</span>
  <span class="grow"></span>
  <button class="pill" id="checkPill">Checking…</button>
  <button class="btn" id="xlsBtn">Export Excel</button>
  <button class="btn" id="pdfBtn">Export PDF</button>
  <button class="btn" id="backupBtn">Backup</button>
  <label class="btn" for="restoreFile">Restore</label>
  <input type="file" id="restoreFile" accept=".json,application/json" hidden>
  <div class="mobile-nav"><select id="mobNav" aria-label="Go to"></select></div>
</header>
<div class="app">
  <nav class="side" id="sideNav"></nav>
  <main><div class="page" id="page"></div></main>
</div>
<div class="toast" id="toast" hidden></div>
<div id="printArea" aria-hidden="true"></div>

<script>
"use strict";
/* ---------------- helpers ---------------- */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const uid = () => Math.random().toString(36).slice(2, 10);
const num = v => { const n = typeof v === "number" ? v : parseFloat(v); return isFinite(n) ? n : 0; };
function parseAmt(s) {
  s = String(s).trim(); if (!s) return 0;
  let neg = /^\(.*\)$/.test(s) || s.startsWith("-");
  s = s.replace(/[(),\s₹-]/g, "");
  const n = parseFloat(s); return isFinite(n) ? (neg ? -n : n) : 0;
}
let DEC = 0;
function fmt(n, dash = true) {
  n = num(n); if (Math.abs(n) < 0.005) return dash ? "-" : "";
  const s = Math.abs(n).toLocaleString("en-US", { minimumFractionDigits: DEC, maximumFractionDigits: DEC });
  return n < 0 ? "-" + s : s;
}
function fmtIn(n) {
  n = num(n); if (Math.abs(n) < 0.0000001) return "";
  const s = Math.abs(n).toLocaleString("en-US", { maximumFractionDigits: 2 });
  return n < 0 ? "-" + s : s;
}
const MONTHS = ["January","February","March","April","May","June","July","August","September","October","November","December"];
function dlabel(d) { return d.getDate() + " " + MONTHS[d.getMonth()] + " " + d.getFullYear(); }
function dates(S) {
  const cy = new Date((S.info.fyEnd || "2026-03-31") + "T00:00:00");
  const py = new Date(cy); py.setFullYear(cy.getFullYear() - 1);
  const pys = new Date(py); pys.setFullYear(py.getFullYear() - 1); pys.setDate(pys.getDate() + 1);
  const cys = new Date(py); cys.setDate(cys.getDate() + 1);
  return { cy: dlabel(cy), py: dlabel(py), pyStart: dlabel(pys), cyStart: dlabel(cys) };
}
function unitLabel() { return { "Rs.": "Amount in ₹", "Rs. in thousands": "₹ in '000", "Rs. in lakhs": "₹ in lakhs", "Rs. in crores": "₹ in crores" }[S.info.unit] || S.info.unit; }
function toast(msg) { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => t.hidden = true, 3200); }

/* ---------------- note definitions ---------------- */
// row: {k,label,tag,sign,na:[cols],auto:fn(C)->{col:val},indent}; heading: {h,tag}
const r = (k, label, o = {}) => ({ k, label, ...o });
const h = (label, tag) => ({ h: label, tag });
const LOANS_ROWS = [
  h("Capital advances", "(a)"),
  r("cap_good", "Considered good", { indent: 1 }),

const FA_DEFAULT = [["Land & Building", "t", 10], ["Furniture & Fixtures", "t", 10], ["Plant & Machinery", "t", 15], ["Office Equipment", "t", 15],
  ["Motor Car", "t", 15], ["Computer & Printer", "t", 40], ["Computer Software", "i", 40]];
const FA_F = ["open", "add1", "add2", "sale"];

const POLICIES = `[A] Basis of Preparation of Financial Statements
The financial statements have been prepared under the historical cost convention on the accrual basis of accounting, in accordance with the generally accepted accounting principles in India and the Accounting Standards issued by the Institute of Chartered Accountants of India, as applicable to the entity.

[B] Use of Estimates
The preparation of the financial statements requires estimates and assumptions to be made that affect the reported amounts of assets and liabilities on the date of the financial statements and the reported amount of revenues and expenses during the reporting period. Differences between actual results and estimates are recognised in the period in which the results are known or materialise.

[C] Property, Plant & Equipment
Property, plant & equipment are stated at cost less depreciation. Cost comprises the purchase price, borrowing cost if capitalisation criteria are met, and directly attributable cost of bringing the asset to its working condition for its intended use.

[D] Depreciation
Depreciation is provided on the written down value method at the rates prescribed under the Income-tax Act, 1961. Additions put to use for less than 180 days during the year are depreciated at half the rate.

[E] Inventories
Inventories are valued at the lower of cost and net realisable value. Cost is arrived at on FIFO basis and is exclusive of GST.

[F] Revenue Recognition
Sales are recognised on delivery of goods, which generally coincides with the transfer of ownership, and are stated exclusive of GST. All other income and expenses are accounted for on accrual basis.

[G] Taxes on Income
Current tax is measured at the amount expected to be paid in accordance with the provisions of the Income-tax Act, 1961. Deferred tax is recognised on timing differences between taxable and accounting income, subject to consideration of prudence.

[H] Provisions, Contingent Liabilities and Contingent Assets
A provision is recognised when there is a present obligation as a result of a past event and it is probable that an outflow of resources will be required to settle it. Contingent liabilities are not recognised but are disclosed in the notes. Contingent assets are neither recognised nor disclosed.

[I] Cash and Cash Equivalents
Cash and cash equivalents include cash on hand, balances with banks and short-term deposits with an original maturity of three months or less.`;

/* ---------------- state ---------------- */
function blankState(name) {

  return {

      skipNil: true, place: "", date: "", caFirm: "", frn: "", caName: "", caDesig: "Partner", mno: "", udin: "", regLine: "", about: "", policies: POLICIES },
    allocate: true,
    partners: [{ id: uid(), name: "", share: 50, pshare: 50, cy: {}, py: {} }, { id: uid(), name: "", share: 50, pshare: 50, cy: {}, py: {} }],
    vals: {}, extra: {}, text: {}, parties: { debtors: [], creditors: [] },
    otherNotes: OTHER_NOTES.map(([title, text]) => ({ id: uid(), title, text })),
    fa: { assets: FA_DEFAULT.map(([name, kind, rate]) => ({ id: uid(), name, kind, rate })), py: {} },
    cwip: {}, iaud: {},
  };
}
let S = null;            // current entity
let ENT = {};            // id -> state
let C = {};              // computed values
let route = "info";
let p3Year = "cy";
let deleteArmed = false;

function getV(n, rk, c) { return S.vals[n]?.[rk]?.[c]; }
function setV(n, rk, c, val) { ((S.vals[n] ||= {})[rk] ||= {})[c] = val; }

/* ---------------- compute ---------------- */
function rowsOf(note, sec) {
  const ex = (S.extra[note.id + "." + sec.id] || []).map(e => ({ k: "x_" + e.id, label: e.label, extra: e }));
  return [...sec.rows, ...ex];
}
function computeNote(note) {
  const amt = AMT_COLS[note.cols];
  const tot = Object.fromEntries(amt.map(c => [c, 0]));
  for (const sec of note.sections) {
    const st = Object.fromEntries(amt.map(c => [c, 0]));
    for (const row of rowsOf(note, sec)) {
      if (row.h) continue;
      const av = row.auto ? row.auto(C) : null;
      row.live = !!av;
      for (const c of amt) {
        const val = av ? num(av[c]) : (row.na?.includes(c) ? 0 : num(getV(note.id, sec.id + "." + row.k, c)));
        C[`${note.id}.${sec.id}.${row.k}.${c}`] = val;
        st[c] += (row.sign || 1) * val;
      }
    }
    for (const c of amt) {
      C[`${note.id}.s.${sec.id}.${c}`] = st[c];
      if (!sec.memo) tot[c] += (sec.sign || 1) * st[c];
      C[`${note.id}.t.${c}`] = tot[c];
    }
  }
}
const rnd = x => { const f = Math.pow(10, DEC); return Math.round(x * f) / f; };
function computePPE() {
  const T = { open: 0, add1: 0, add2: 0, add: 0, sale: 0, close: 0, dep: 0, wdv: 0 };
  const K = { t: { dep: 0, wdv: 0, open: 0 }, i: { dep: 0, wdv: 0, open: 0 } };
  for (const a of S.fa.assets) {
    const v = f => num(a[f]), rate = num(a.rate);
    const o = { open: v("open"), add1: v("add1"), add2: v("add2"), sale: v("sale") };
    o.add = o.add1 + o.add2;
    o.close = o.open + o.add - o.sale;
    // full rate on opening and additions used 180 days or more (less sales); half rate on later additions
    o.dep = rnd(Math.max(o.open + o.add1 - o.sale, 0) * rate / 100 + o.add2 * rate / 200);
    o.wdv = o.close - o.dep;
    for (const k in o) { C[`fa.${a.id}.${k}`] = o[k]; T[k] += o[k]; }
    const k = K[a.kind === "i" ? "i" : "t"]; k.dep += o.dep; k.wdv += o.wdv; k.open += o.open;
  }
  for (const k in T) C[`fa.T.${k}`] = T[k];
  const p = S.fa.py || {}, pv = f => num(p[f]);
  C["fa.py.open"] = pv("open"); C["fa.py.add"] = pv("add"); C["fa.py.sale"] = pv("sale"); C["fa.py.dep"] = pv("dep");
  C["fa.py.close"] = pv("open") + pv("add") - pv("sale"); C["fa.py.wdv"] = C["fa.py.close"] - pv("dep");
  // the previous year's W.D.V. of each block is this year's opening balance
  C["ppe.tangible.dep_cy"] = K.t.dep; C["ppe.intangible.dep_cy"] = K.i.dep;
  C["ppe.tangible.net_cy"] = K.t.wdv; C["ppe.intangible.net_cy"] = K.i.wdv;
  C["ppe.tangible.net_py"] = K.t.open; C["ppe.intangible.net_py"] = K.i.open;
  C["ppe.tangible.dep_py"] = pv("dep"); C["ppe.intangible.dep_py"] = 0;
  for (const w of ["cwip", "iaud"]) {
    const v = f => num(S[w][f]);
    const py = v("open") + v("add_py") - v("cap_py");
    C[`${w}.open_py`] = v("open"); C[`${w}.close_py`] = py; C[`${w}.open_cy`] = py;
    C[`${w}.close_cy`] = py + v("add_cy") - v("cap_cy");
  }
}
function compute() {
  C = {};
  DEC = num(S.info.dec);
  computePPE();
  for (const y of ["cy", "py"]) {
    for (const k of ["debtors", "creditors"]) C[`${k}.T.${y}`] = 0;
    for (const a of ["lt6", "gt6"]) for (const st of ["sec", "unsec", "doubt"]) C[`debtors.${a}.${st}.${y}`] = 0;
    C[`creditors.msme.${y}`] = 0; C[`creditors.oth.${y}`] = 0;
    for (const p of S.parties.debtors) {
      const v = num(p[y]), bk = (y === "py" ? p.bucketPy : p.bucket) || p.bucket || "m6";
      C[`debtors.${halfOf(bk)}.${p.st || "unsec"}.${y}`] += v; C[`debtors.T.${y}`] += v;
      const row = (p.disp === "yes" ? "d" : "u") + (p.st === "doubt" ? "bad" : "good");
      C[`ag.debtors.${y}.${row}.${bk}`] = (C[`ag.debtors.${y}.${row}.${bk}`] || 0) + v;
      C[`ag.debtors.${y}.${row}.T`] = (C[`ag.debtors.${y}.${row}.T`] || 0) + v;
    }
    for (const p of S.parties.creditors) {
      const v = num(p[y]), bk = (y === "py" ? p.bucketPy : p.bucket) || p.bucket || "y1";
      C[`creditors.${p.msme === "yes" ? "msme" : "oth"}.${y}`] += v; C[`creditors.T.${y}`] += v;
      const row = (p.disp === "yes" ? "d" : "u") + (p.msme === "yes" ? "m" : "o");
      C[`ag.creditors.${y}.${row}.${bk}`] = (C[`ag.creditors.${y}.${row}.${bk}`] || 0) + v;
      C[`ag.creditors.${y}.${row}.T`] = (C[`ag.creditors.${y}.${row}.T`] || 0) + v;
    }
  }
  for (const y of ["cy", "py"]) {
    C[`p.rem.${y}`] = S.partners.reduce((a, p) => a + num(p[y].rem), 0);
    C[`p.int.${y}`] = S.partners.reduce((a, p) => a + num(p[y].int), 0);
  }
  ["n6", "n19", "n20", "n21", "n22", "n23", "n24", "n25", "tx"].forEach(id => computeNote(NOTE_BY[id]));
  for (const y of ["cy", "py"]) {
    const g = k => C[k + "." + y] || 0;
    const P = {};
    P.rev = g("n19.t"); P.oi = g("n20.t"); P.ti = P.rev + P.oi;
    P.cogs = g("n21.t"); P.emp = g("n22.t"); P.fin = g("n23.t"); P.dep = g("n24.t"); P.oth = g("n25.t");
    P.exp = P.cogs + P.emp + P.fin + P.dep + P.oth;
    P.v = P.ti - P.exp;
    P.exc = g("tx.s.exc"); P.vii = P.v - P.exc;
    P.ext = g("tx.s.ext"); P.ix = P.vii - P.ext;
    P.rem = g("p.rem"); P.pbt = P.ix - P.rem;
    P.cur = g("tx.tax.cur"); P.ey = g("tx.tax.ey"); P.def = g("tx.tax.def"); P.tax = P.cur + P.ey + P.def;
    P.cont = P.pbt - P.tax;
    P.dp = g("tx.disc.profit"); P.dt = g("tx.disc.tax"); P.disc = P.dp - P.dt;
    P.profit = P.cont + P.disc;
    for (const k in P) C[`pl.${k}.${y}`] = P[k];
    C[`pl.alloc_off.${y}`] = S.allocate ? 0 : P.profit;
    // owners' capital
    let close = 0, shareT = 0;
    S.partners.forEach(p => {
      const sh = y === "cy" ? num(p.share) : num(p.pshare ?? p.share);
      shareT += sh;
      const v = f => num(p[y][f]);
      const prof = S.allocate ? P.profit * sh / 100 : 0;
      const cl = v("open") + v("intro") + v("rem") + v("int") - v("wd") + prof;
      C[`p.${p.id}.share.${y}`] = prof; C[`p.${p.id}.close.${y}`] = cl;
      close += cl;
      for (const f of ["open", "intro", "rem", "int", "wd"]) C[`p.T.${f}.${y}`] = (C[`p.T.${f}.${y}`] || 0) + v(f);
    });
    C[`p.T.share.${y}`] = S.allocate ? S.partners.reduce((a, p) => a + C[`p.${p.id}.share.${y}`], 0) : 0;
    C[`p.T.close.${y}`] = close; C[`p.shareT.${y}`] = shareT;
  }
  NOTES.filter(n => !["n6", "n19", "n20", "n21", "n22", "n23", "n24", "n25", "tx"].includes(n.id)).forEach(computeNote);
  for (const y of ["cy", "py"]) {
    const g = k => C[k] || 0;
    const B = {};
    B.cap = g(`p.T.close.${y}`); B.res = g(`n4.t.${y}`); B.of = B.cap + B.res;
    const dt = g(`n6.t.${y}`);
    B.ltb = g(`n5a.t.${y}`); B.dtl = Math.max(dt, 0); B.oltl = g(`n7.t.${y}`); B.ltp = g(`n8a.t.${y}`);
    B.ncl = B.ltb + B.dtl + B.oltl + B.ltp;
    B.stb = g(`n5b.t.${y}`); B.tp = g(`n9.t.${y}`); B.ocl = g(`n10.t.${y}`); B.stp = g(`n8b.t.${y}`);
    B.cl = B.stb + B.tp + B.ocl + B.stp;
    B.el = B.of + B.ncl + B.cl;
    B.ppe = g(`ppe.tangible.net_${y}`); B.intang = g(`ppe.intangible.net_${y}`); B.cwip = g(`cwip.close_${y}`); B.iaud = g(`iaud.close_${y}`);
    B.nci = g(`n12a.t.${y}`); B.dta = Math.max(-dt, 0); B.ltla = g(`n13a.t.${y}`); B.onca = g(`n14.t.${y}`);
    B.nca = B.ppe + B.intang + B.cwip + B.iaud + B.nci + B.dta + B.ltla + B.onca;
    B.ci = g(`n12b.t.${y}`); B.inv = g(`n15.t.${y}`); B.tr = g(`n16.t.${y}`); B.cash = g(`n17.t.${y}`); B.stla = g(`n13b.t.${y}`); B.oca = g(`n18.t.${y}`);
    B.ca = B.ci + B.inv + B.tr + B.cash + B.stla + B.oca;
    B.as = B.nca + B.ca;
    B.diff = B.el - B.as;
    for (const k in B) C[`bs.${k}.${y}`] = B[k];
  }
  numberNotes();
}

/* ---------------- checks ---------------- */
function checks() {
  const out = [], d = dates(S), e = 0.5 / Math.pow(10, DEC);
  for (const y of ["cy", "py"]) {
    const df = C[`bs.diff.${y}`];
    out.push(Math.abs(df) < e
      ? { s: "ok", t: `Balance Sheet as at ${d[y]} tallies.` }
      : { s: "bad", t: `Balance Sheet as at ${d[y]} does not tally. Equity and liabilities exceed assets by ${fmt(df)}. Check the notes for missing or misplaced figures.`, go: "bs" });
  }
  if (S.allocate && S.partners.length) for (const y of ["cy", "py"]) {
    const t = C[`p.shareT.${y}`];
    if (Math.abs(t - 100) > 0.001) out.push({ s: "bad", t: `Profit-sharing ratios for ${y === "cy" ? "the current year" : "the previous year"} add up to ${t}%, not 100%. Part of the profit is not credited to any owner.`, go: "n3" });
  }
  S.partners.forEach(p => {
    const pyc = C[`p.${p.id}.close.py`], cyo = num(p.cy.open);
    if (Math.abs(pyc - cyo) >= e && (Math.abs(pyc) >= e || Math.abs(cyo) >= e))
      out.push({ s: "warn", t: `${p.name || "Unnamed owner"}: opening capital this year (${fmt(cyo)}) differs from last year's closing capital (${fmt(pyc)}).`, go: "n3" });
  });
  const clos = y => ["rm", "pm", "om"].reduce((a, s) => a + (C[`n21.${s}.close.${y}`] || 0), 0) + ["c_sit", "c_wip", "c_fg"].reduce((a, k) => a + (C[`n21.chg.${k}.${y}`] || 0), 0);
  for (const y of ["cy", "py"]) {
    const a = C[`n15.t.${y}`], b = clos(y);
    if (Math.abs(a - b) >= e && b !== 0) out.push({ s: "warn", t: `Closing stock used in Cost of goods sold (${fmt(b)}) differs from Inventories in Note ${NN("n15")} (${fmt(a)}) as at ${d[y]}. Differences can be valid (stores, loose tools).`, go: "n15" });
  }
  const opn = ["rm", "pm", "om"].reduce((a, s) => a + (C[`n21.${s}.open.cy`] || 0), 0) + ["o_sit", "o_wip", "o_fg"].reduce((a, k) => a + (C[`n21.chg.${k}.cy`] || 0), 0);
  const pyc = clos("py");
  if (pyc !== 0 && Math.abs(opn - pyc) >= e) out.push({ s: "warn", t: `Opening stock this year (${fmt(opn)}) differs from closing stock last year (${fmt(pyc)}) in Note ${NN("n21")}.`, go: "n21" });
  if (C["bs.dtl.cy"] > 0 && C["bs.dta.cy"] > 0) out.push({ s: "warn", t: "Deferred tax shows both an asset and a liability." });
  if ((Math.abs(C["fa.py.wdv"]) >= e || Math.abs(C["fa.T.open"]) >= e) && Math.abs(C["fa.py.wdv"] - C["fa.T.open"]) >= e)
    out.push({ s: "warn", t: `Previous-year W.D.V. in the fixed asset schedule (${fmt(C["fa.py.wdv"])}) differs from this year's opening balance (${fmt(C["fa.T.open"])}).`, go: "n11" });
  const norate = S.fa.assets.filter(a => !num(a.rate) && FA_F.some(f => num(a[f])));
  if (norate.length) out.push({ s: "warn", t: `No depreciation rate entered for ${norate.map(a => a.name || "an unnamed asset").join(", ")}.`, go: "n11" });
  return out;
}

/* ---------------- render: generic note ---------------- */
function cellsFor(note, sec, row, cols) {
  if (row.h) return cols.map(() => '<td class="num"></td>').join("");
  return cols.map(c => {
    const amt = !c.text;
    if (row.na?.includes(c.k)) return `<td class="num na">NA</td>`;
    if (row.auto && row.live) return amt ? `<td class="num calc" data-calc="${note.id}.${sec.id}.${row.k}.${c.k}"></td>` : '<td class="num"></td>';
    const v = getV(note.id, sec.id + "." + row.k, c.k);
    if (!amt) return `<td><input class="amt t" data-n="${note.id}" data-r="${sec.id}.${row.k}" data-c="${c.k}" data-text="1" value="${esc(v ?? "")}" aria-label="${esc(row.label)} ${esc(c.label)}"></td>`;
    return `<td class="num"><input class="amt" inputmode="decimal" data-n="${note.id}" data-r="${sec.id}.${row.k}" data-c="${c.k}" value="${esc(fmtIn(v))}" aria-label="${esc(row.label)} ${esc(c.g || "")} ${esc(c.label)}"></td>`;
  }).join("");
}
function totalCells(prefix, cols) {
  return cols.map(c => c.text ? '<td class="num"></td>' : `<td class="num calc" data-calc="${prefix}.${c.k}"></td>`).join("");
}
function noteTable(note) {
  const cols = colsFor(S, note.cols);
  const groups = cols.some(c => c.g);
  let head = "";
  if (groups) {
    const gs = []; cols.forEach(c => { const l = gs[gs.length - 1]; if (l && l.g === (c.g || "")) l.n++; else gs.push({ g: c.g || "", n: 1 }); });
    head += `<tr class="grp"><th></th><th></th>${gs.map(g => `<th colspan="${g.n}">${esc(g.g)}</th>`).join("")}</tr>`;
  }
  head += `<tr><th></th><th>Particulars</th>${cols.map(c => `<th class="num">${esc(c.label)}</th>`).join("")}</tr>`;
  let body = "";
  for (const sec of note.sections) {
    if (sec.title) body += `<tr class="sec"><td class="tag"></td><td>${esc(sec.title)}${sec.memo ? " <span class=\"status\">(for disclosure, not added to the total)</span>" : ""}</td>${cols.map(() => '<td class="num"></td>').join("")}</tr>`;
    for (const row of rowsOf(note, sec)) {
      const cls = [row.h ? "hd" : "", row.indent ? "indent" : "", sec.memo ? "memo" : ""].join(" ");
      let lbl = row.extra
        ? `<div style="display:flex;gap:4px;align-items:center"><input class="lbl-in" data-xl="${note.id}.${sec.id}" data-xid="${row.extra.id}" value="${esc(row.label)}" placeholder="Describe this line" aria-label="Line description"><button class="rowx" title="Remove line" aria-label="Remove line" data-xdel="${note.id}.${sec.id}" data-xid="${row.extra.id}">×</button></div>`
        : esc(row.h || row.label) + (row.auto && row.live ? `<span class="auto">${row.src ? "auto" : "from list"}</span>${row.src ? ` <button class="link" data-go="${row.src}">from Note ${NN(row.src)}</button>` : ""}` : "");
      body += `<tr class="${cls}"><td class="tag">${esc(row.tag || "")}</td><td class="lbl">${lbl}</td>${cellsFor(note, sec, row, cols)}</tr>`;
    }
    if (sec.add) body += `<tr class="addrow"><td class="tag"></td><td><button class="btn small" data-add="${note.id}.${sec.id}">+ Add line</button></td>${cols.map(() => '<td class="num"></td>').join("")}</tr>`;
    if (!sec.noSub && !sec.memo && sec.total !== false) body += `<tr class="sub"><td class="tag"></td><td>${esc(sec.total ?? "Total")}</td>${totalCells(`${note.id}.s.${sec.id}`, cols)}</tr>`;
  }

function pasteParties(kind) {
  const ta = $("#paste_" + kind); if (!ta) return;
  let n = 0;
  for (const line of ta.value.split(/\r?\n/)) {
    const c = line.split("\t").map(x => x.trim());
    if (c.length < 2 || !c[0] || /^(party|particulars|name|total|grand total)/i.test(c[0])) continue;
    const cy = parseAmt(c[1]);
    if (!cy && !parseAmt(c[3] || "")) continue;
    S.parties[kind].push(kind === "debtors" ? { id: uid(), name: c[0], grp: c[2] || "", st: "unsec", disp: "no", bucket: "m6", bucketPy: "m6", cy, py: parseAmt(c[3] || "") }
      : { id: uid(), name: c[0], grp: c[2] || "", msme: /msme|micro|small/i.test(c[2] || "") ? "yes" : "no", disp: "no", bucket: "y1", bucketPy: "y1", cy, py: parseAmt(c[3] || "") });
    n++;
  }
  ta.value = "";
  touch(); render();
  toast(n ? `Added ${n} part${n > 1 ? "ies" : "y"}.` : "No rows found. Each line needs a name and an amount separated by a tab.");
}

/* ---------------- main render ---------------- */
function render() {
  if (!S) return;
  compute();
  renderNav();
  let html;
  if (route === "info") html = pageInfo();
  else if (route === "n1") html = pageN1();
  else if (route === "on") html = pageOther();
  else if (route === "bs") html = pageBS();
  else if (route === "pl") html = pagePL();
  else if (route === "checks") html = pageChecks();
  else if (route === "n3") html = pageN3();
  else if (route === "n11") html = pageN11();
  else if (NOTE_BY[route]) html = pageNote(NOTE_BY[route]);
  else { route = "info"; html = pageInfo(); }
  $("#page").innerHTML = html;
  refresh();
  renderEntities();
}
function refresh() {
  compute();
  document.querySelectorAll("[data-calc]").forEach(el => { el.textContent = fmt(C[el.dataset.calc]); });

class XSheet {

        margins: { left: 0.45, right: 0.4, top: 0.5, bottom: 0.5, header: 0, footer: 0 }, printTitlesRow: opt.titles || undefined },

const SW = [40, 6.5, 12, 12, 12, 12];

      ["Non Current Investments", "n12a", "nci"], ["Deferred Tax Assets (Net)", "n6", "dta"], ["Long Term Loans & Advances", "n13a", "ltla"], ["Other Non Current Assets", "n14", "onca"]] },

function vv(key, y) { return num(C[`${key}.${y}`]); }
function stmtSheet(wb, kind) {

    for (const l of [L("Cost of Goods Sold", "n21", "cogs"), L("Employee Benefit Expense", "n22", "emp"), L("Finance Cost", "n23", "fin"), L("Depreciation and Amortization Expense", "n24", "dep"), L("Other Expense", "n25", "oth")])
      if (!skip || !nil2(l.cy, l.py)) X.row(R(l.label, { note: l.note, vals: pair(false, l.cy, l.py) }));
    X.row(grand("Total Expense", vv("pl.exp", "cy"), vv("pl.exp", "py")));
    X.row({ frame: SFR, h: 6 });
    const line = (label, key, o = {}) => X.row(R(label, { b: o.b, note: o.note, vals: pair(false, vv(`pl.${key}`, "cy"), vv(`pl.${key}`, "py"), { b: o.b }) }));
    const has = k => !nil2(vv(`pl.${k}`, "cy"), vv(`pl.${k}`, "py"));

      line(`${S.info.ownerWord === "Partner" || !S.info.ownerWord ? "Partners'" : OWN()} Remuneration`, "rem", { note: "n3" });

    X.row(R("TAX EXPENSE", { b: true, u: true }));
    taxLeaves.forEach((l, i) => X.row(R(l.label, { vals: pair(true, l.cy, l.py, { bb: i === taxLeaves.length - 1 ? 1 : 0 }) })));
    X.row(R("", { vals: pair(false, vv("pl.tax", "cy"), vv("pl.tax", "py"), { b: true }) }));
    if (has("disc")) {

/* ----- Notes: A note no. | B particulars | C–J eight narrow columns (each year: items C:D / G:H, totals E:F / I:J) ----- */
const NW = [5, 33, 7, 7, 7, 7, 7, 7, 7, 7];
const SLOT = { cyIn: [3, 4], cyOut: [5, 6], pyIn: [7, 8], pyOut: [9, 10] };
const NFR = { l: [2, 3, 7], r: [10], span: [2, 10] };
const sc = (slot, v, o = {}) => cell(slot[0], v, { to: slot[1], ...o });
function noteHeadRows(no, title, pl) {
  const d = FD();
  return [{ cells: [cell(1, no, { b: true, al: "right" }), cell(2, title, { to: 10, b: true, u: true })], h: 16 },
    { frame: NFR, top: true, bottom: true, cells: [cell(3, pl ? d.fy : `AS AT ${d.cy}`, { to: 6, b: true, al: "center" }), cell(7, pl ? d.fyPy : `AS AT ${d.py}`, { to: 10, al: "center" })] }];
}
function noteRows(note) {
  const no = NN(note.id), pl = note.grp === "pl", skip = !!S.info.skipNil, inv = note.cols === "INV";
  const out = [{ cells: [cell(1, no, { b: true, al: "right" }), cell(2, note.title.replace(/\b\w/g, c => c.toUpperCase()), { to: 10, b: true, u: true })], h: 16 }];
  const d = FD(), body = [];
  if (inv) {
    out.push({ frame: { l: [2, 3, 7], r: [10], span: [2, 10] }, top: true, cells: [cell(3, `AS AT ${d.cy}`, { to: 6, b: true, al: "center", bb: 1 }), cell(7, `AS AT ${d.py}`, { to: 10, al: "center", bb: 1 })] });
    out.push({ frame: { l: [2, 3, 5, 7, 9], r: [10], span: [2, 10] }, bottom: true, cells: [cell(3, "No. of Units", { to: 4, al: "center" }), cell(5, "Amount", { to: 6, al: "center" }), cell(7, "No. of Units", { to: 8, al: "center" }), cell(9, "Amount", { to: 10, al: "center" })] });
  } else out.push(noteHeadRows(no, "", pl)[1]);
  const fr = inv ? { l: [2, 3, 5, 7, 9], r: [10], span: [2, 10] } : NFR;
  if (note.lead) body.push({ cells: [cell(2, note.lead, { i: true })], h: hFor(note.lead, 33) });
  const secs = note.sections.filter(sec => !sec.memo);
  // pick the visible lines of each section
  const plan = secs.map(sec => {
    const rows = rowsOf(note, sec).map(row => {
      if (row.h) return { row };
      const zero = ["cy", "py"].every(c => Math.abs(C[`${note.id}.${sec.id}.${row.k}.${c}`] || 0) < 1e-9) && (!inv || ["n_cy", "n_py"].every(c => !getV(note.id, sec.id + "." + row.k, c)));
      return { row, zero };
    });
    rows.forEach((x, i) => { if (x.row.h) { let j = i + 1, any = false; while (j < rows.length && !rows[j].row.h) { if (!rows[j].zero) any = true; j++; } x.zero = !any; } });
    return { sec, rows: rows.filter(x => !skip || !x.zero) };
  }).filter(p => p.rows.length || !skip);
  const multi = plan.length > 1;
  for (const { sec, rows } of plan) {
    const vals = rows.filter(x => !x.row.h);
    const inner = !inv && multi && vals.length > 1;     // several lines under a heading: lines in the item column, total beside them
    if (sec.title) body.push({ cells: [cell(2, sec.title, { b: true, u: true })], h: hFor(sec.title, 33) });
    rows.forEach((x, i) => {
      const row = x.row, label = row.h || row.label || "Others (specify nature)";
      if (row.h) { body.push({ cells: [cell(2, label, { u: true, ind: row.indent ? 1 : 0 })], h: hFor(label, 33) }); return; }
      const lastVal = rows.slice(i + 1).every(y => y.row.h);
      const g = c => num(C[`${note.id}.${sec.id}.${row.k}.${c}`]);
      const cells = [cell(2, label, { ind: row.indent ? 1 : 0 })];
      if (inv) {
        if (row.na?.includes("n_cy")) cells.push(sc([3, 4], "NA", { al: "center" })); else cells.push(sc([3, 4], String(getV(note.id, sec.id + "." + row.k, "n_cy") || ""), { al: "right" }));
        cells.push(sc([5, 6], g("cy")));
        if (row.na?.includes("n_py")) cells.push(sc([7, 8], "NA", { al: "center" })); else cells.push(sc([7, 8], String(getV(note.id, sec.id + "." + row.k, "n_py") || ""), { al: "right" }));
        cells.push(sc([9, 10], g("py")));
      } else {
        cells.push(sc(inner ? SLOT.cyIn : SLOT.cyOut, g("cy"), { bb: inner && lastVal ? 1 : 0 }), sc(inner ? SLOT.pyIn : SLOT.pyOut, g("py"), { bb: inner && lastVal ? 1 : 0 }));
      }
      body.push({ cells, h: hFor(label, 33) });

    if (inner || (inv && multi && vals.length)) body.push({ cells: [sc(inv ? [5, 6] : SLOT.cyOut, num(C[`${note.id}.s.${sec.id}.cy`]), { b: true, bt: inv ? 1 : 0 }), sc(inv ? [9, 10] : SLOT.pyOut, num(C[`${note.id}.s.${sec.id}.py`]), { b: true, bt: inv ? 1 : 0 })] });
    if (multi) body.push({ h: 5 });
  }
  if (!note.noTotal) body.push({ cells: [cell(2, "Total", { b: true, al: "right" }), sc(inv ? [5, 6] : SLOT.cyOut, num(C[`${note.id}.t.cy`]), { b: true, bt: 1, bb: 1 }), sc(inv ? [9, 10] : SLOT.pyOut, num(C[`${note.id}.t.py`]), { b: true, bt: 1, bb: 1 })] });
  out.push(...framed(body, fr));
  if (S.text[note.id]) {
    out.push({ h: 4 });
    if (note.footLabel) out.push({ cells: [cell(2, note.footLabel.replace(/\b\w/g, c => c.toUpperCase()), { to: 10, b: true, u: true })] });
    String(S.text[note.id]).split("\n").filter(Boolean).forEach(p => out.push({ cells: [cell(2, p, { to: 10 })], h: hFor(p, 89) }));

}

function textNote(no, title, text, lettered) {

/* ---------------- PDF: the same layout drawn as A4 HTML pages ---------------- */
class HSheet {
  constructor(wb, name, widths, opt) {
    this.name = name; this.W = widths; this.N = widths.length; this.avail = opt.avail; this.orient = opt.orient;
    this.titleRows = opt.titles ? +String(opt.titles).split(":")[1] : 0;
    this.r = 0; this.used = 0; this.body = 0; this.titles = []; this.titleH = 0; this.pages = [[]];
    wb.sheets.push(this);
  }
  pageBreak() { if (this.r > this.body) { this.pages.push([...this.titles]); this.used = this.titleH; } }
  row(spec) {
    const h = spec.h || RH;
    if (this.used + h > this.avail) this.pageBreak();
    this.r++;
    const cells = Array.from({ length: this.N }, () => ({ html: "", span: 1, st: [], b: {} }));
    const skip = new Set();
    for (const c of spec.cells || []) {
      const last = c.to || c.c, x = cells[c.c - 1];
      for (let k = c.c + 1; k <= last; k++) skip.add(k);
      x.span = last - c.c + 1; x.last = last;
      x.html = hval(c);
      const isNum = typeof c.v === "number";
      x.st.push(`text-align:${c.al || (isNum ? "right" : "left")}`, `vertical-align:${c.va === "middle" ? "middle" : c.va === "bottom" ? "bottom" : "top"}`);
      if (c.b) x.st.push("font-weight:700"); if (c.i) x.st.push("font-style:italic"); if (c.u) x.st.push("text-decoration:underline");
      if (c.sz) x.st.push(`font-size:${c.sz}pt`); if (c.ind) x.st.push(`padding-left:${3 + c.ind * 9}pt`);
      if (c.font === "Cambria") x.st.push("font-family:'Source Serif 4',Cambria,Georgia,serif");
      if (c.box) { x.b.top = x.b.bottom = x.b.left = x.b.right = "solid"; }
      if (c.bt) x.b.top = "solid";
      if (c.bb) x.b.bottom = c.bb === 2 ? "double" : "solid";
    }
    if (spec.frame) {
      const [a, b] = spec.frame.span || [1, this.N];
      const owner = k => { for (let j = k; j >= 1; j--) if (!skip.has(j)) return j; return k; };
      for (const k of spec.frame.l || []) if (owner(k) === k) cells[k - 1].b.left = "solid";
      for (const k of spec.frame.r || []) { const o = owner(k); if ((cells[o - 1].last || o) === k) cells[o - 1].b.right = "solid"; }
      for (let k = a; k <= b; k++) if (!skip.has(k)) { if (spec.top) cells[k - 1].b.top ||= "solid"; if (spec.bottom) cells[k - 1].b.bottom ||= "solid"; }
    }
    const tds = cells.map((x, i) => {
      if (skip.has(i + 1)) return "";
      const bs = ["top", "bottom", "left", "right"].filter(s => x.b[s]).map(s => `border-${s}:${x.b[s] === "double" ? "2.4pt double" : "0.7pt solid"} #000`);
      return `<td${x.span > 1 ? ` colspan="${x.span}"` : ""} style="${[...x.st, ...bs].join(";")}">${x.html}</td>`;
    }).join("");
    const tr = `<tr style="height:${h}pt">${tds}</tr>`;
    this.pages[this.pages.length - 1].push(tr);
    if (this.r <= this.titleRows) { this.titles.push(tr); this.titleH = this.used + h; }
    this.used += h;
  }
  block(rows) { return XSheet.prototype.block.call(this, rows); }
  gap(h = 10) { return XSheet.prototype.gap.call(this, h); }
  html() {
    const tot = this.W.reduce((a, b) => a + b, 0);
    const cols = `<colgroup>${this.W.map(w => `<col style="width:${(w / tot * 100).toFixed(3)}%">`).join("")}</colgroup>`;
    return this.pages.filter(p => p.length).map(p => {
      const t = `<table>${cols}${p.join("")}</table>`;
      return this.orient === "landscape" ? `<section class="pp land"><div class="rot">${t}</div></section>` : `<section class="pp">${t}</section>`;
    }).join("");
  }
}
function hval(c) {

  if (typeof v !== "number") return esc(v).replace(/\n/g, "<br>");

  try {
    const [d, u] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    dbReady = true;
    if (!d || !u) { setStatus("Saved in this browser"); return; }
    const id = await u.id();
    if (!id) { setStatus("Saved in this browser"); return; }
    db = d; dbUid = id;
    const snap = await db.collection("data/users/" + id).get();
    let changed = false;
    for (const doc of snap.docs) {
      const row = doc.data(); if (!row?.data) continue;
      let st; try { st = normalize(JSON.parse(row.data)); } catch { continue; }
      if (!ENT[st.id] || (ENT[st.id].updatedAt || 0) < (st.updatedAt || 0)) { ENT[st.id] = st; changed = true; }
    }
    // drop the untouched example if the account already has real entities
    if (snap.docs.length) for (const e of Object.values(ENT)) if (e.isSample && Object.keys(ENT).length > 1) { delete ENT[e.id]; changed = true; }
    // push local entities the account does not have yet
    const have = new Set(snap.docs.map(x => x.id));
    for (const e of Object.values(ENT)) if (!have.has(e.id) && !e.isSample)
      await db.collection("data/users/" + id).doc(e.id).set({ name: e.info.name, updatedAt: e.updatedAt, data: JSON.stringify(e) });
    if (changed) { if (!ENT[S.id]) S = Object.values(ENT)[0]; lsSave(); render(); }
    setStatus("Saved to your account");
  } catch (e) { setStatus("Saved in this browser"); }
}
boot();
</script>
<script>
if ("serviceWorker" in navigator) addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
